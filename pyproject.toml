[project]
name = "pr-radar"
version = "0.1.0"
description = "Local Django tool for team leads: AI-policy compliance and delivery-quality dashboards from GitHub PR data."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11",
    "httpx>=0.27",
    "huey>=2.5",
    "whitenoise>=6.7",
    "django-tables2>=2.7",
    "django-filter>=24.3",
    "xlsxwriter>=3.2",
    "cryptography>=43.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "respx>=0.21",
    "polib>=1.2",
    "openpyxl>=3.1",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["apps", "tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["migrations", ".tools", "static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
files = [
    "apps/*/services.py",
    "apps/*/selectors.py",
    "apps/catalog/identity.py",
    "apps/activity/derive.py",
    "apps/ai_detection/detectors.py",
    "apps/ai_detection/disclosure.py",
    "apps/ai_detection/rules.py",
    "apps/policy/rules.py",
    "apps/policy/messages.py",
    "apps/metrics/types.py",
    "apps/metrics/registry.py",
    "apps/metrics/rollups.py",
    "apps/metrics/timeframe.py",
    "apps/metrics/docs.py",
    "apps/metrics/calculators",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "apps"]
