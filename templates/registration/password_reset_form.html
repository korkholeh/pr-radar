{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Reset password" %}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="card card-body form-stack">
    <h1 class="page-title mb-4">{% translate "Reset password" %}</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="field">
        <label class="label" for="{{ form.email.id_for_label }}">{% translate "Email" %}</label>
        {{ form.email }}
        {% for error in form.email.errors %}<p class="error-text">{{ error }}</p>{% endfor %}
      </div>
      <button type="submit" class="btn btn-primary">{% translate "Send reset link" %}</button>
    </form>
  </div>
</div>
{% endblock %}
