{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Reset password" %}{% endblock %}

{% block content %}
<div class="mx-auto max-w-sm py-16 text-[var(--text)]">
  <h1 class="text-xl font-semibold mb-6">{% translate "Reset password" %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-4">
      <label class="block mb-1" for="{{ form.email.id_for_label }}">{% translate "Email" %}</label>
      {{ form.email }}
      {% for error in form.email.errors %}<p class="text-[var(--bad)]">{{ error }}</p>{% endfor %}
    </div>
    <button type="submit" class="rounded bg-[var(--accent)] px-4 py-2 text-[var(--on-accent)]">{% translate "Send reset link" %}</button>
  </form>
</div>
{% endblock %}
