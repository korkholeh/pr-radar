{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Password reset complete" %}{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="card card-body form-stack">
    <p>{% translate "Your password has been set. You can log in now." %}</p>
    <a class="link" href="{% url 'accounts:login' %}">{% translate "Log in" %}</a>
  </div>
</div>
{% endblock %}
