{% load i18n static %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" data-theme="{{ theme_resolved }}" data-theme-preference="{{ theme_preference }}">
<head>
<script>
(function () {
  var pref = document.documentElement.getAttribute("data-theme-preference");
  if (pref === "system") {
    var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% translate "PR Radar" %}{% endblock %}</title>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
<script src="{% static 'vendor/htmx.min.js' %}" defer></script>
<script src="{% static 'vendor/chart.umd.js' %}" defer></script>
{% if request.user.is_authenticated %}
<script src="{% url 'javascript-catalog' %}" defer></script>
{% endif %}
<script src="{% static 'js/theme.js' %}" defer></script>
<script src="{% static 'js/formatting.js' %}" defer></script>
<script src="{% static 'js/charts.js' %}" defer></script>
</head>
<body
  class="bg-[var(--bg)] text-[var(--text)] min-h-screen"
  hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
>
{% include "partials/nav.html" %}
{% include "partials/connection_alerts.html" %}
<main class="px-4">
{% block content %}{% endblock %}
</main>
</body>
</html>
