{% load i18n %}
<form method="post" action="{% url 'accounts:set_language' %}" class="language-switcher">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="sr-only" for="language-select">{% translate "Language" %}</label>
  <select id="language-select" name="language" onchange="this.form.requestSubmit()" class="select input-sm w-auto">
    <option value="en" {% if LANGUAGE_CODE == "en" %}selected{% endif %}>English</option>
    <option value="uk" {% if LANGUAGE_CODE == "uk" %}selected{% endif %}>Українська</option>
  </select>
</form>
