{% load i18n %}
<form method="post" action="{% url 'accounts:set_theme' %}" class="theme-switcher" data-theme-switcher>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label class="sr-only" for="theme-select">{% translate "Theme" %}</label>
  <select id="theme-select" name="theme" onchange="this.form.requestSubmit()" class="select input-sm w-auto">
    <option value="system" {% if theme_preference == "system" %}selected{% endif %}>{% translate "System" %}</option>
    <option value="light" {% if theme_preference == "light" %}selected{% endif %}>{% translate "Light" %}</option>
    <option value="dark" {% if theme_preference == "dark" %}selected{% endif %}>{% translate "Dark" %}</option>
  </select>
</form>
