{% load i18n l10n %}
<div class="card card-body mb-6" id="policy-mismatch-list">
  <h2 class="section-title mb-3">{% translate "Disclosure mismatches" %}</h2>
  {% if mismatch_prs %}
    <ul class="space-y-1 text-sm">
      {% for pr in mismatch_prs %}
        <li>
          <a class="link" href="{% url 'dashboards:pull_request_detail' pr.pk %}">
            {{ pr.repository.full_name }}#{{ pr.number|unlocalize }}
          </a>
          — {{ pr.title }}
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="muted">{% translate "No disclosure mismatches in this period." %}</p>
  {% endif %}
</div>
