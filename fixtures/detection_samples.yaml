# Match / non-match corpus for fixtures/detection_rules.yaml, keyed by rule name.
#
# This is a REGRESSION LOCK, not evidence. It proves a pattern still matches what it was written
# for and still rejects the near-miss it was written to avoid — so an edit that quietly breaks a
# rule, or widens it onto innocent text, fails the build. It says nothing about whether any vendor
# emits these strings; only a rule's `provenance` does, and only a human can move a rule to
# `observed` after finding it in a real pull request.
#
# Every rule needs both lists. `matches` alone would let an over-broad pattern ("." matches
# everything) pass forever.
#
# Samples are matched with re.IGNORECASE | re.MULTILINE, exactly as detection compiles them.

samples:
  "Claude Code co-authored-by trailer":
    matches:
      - "Co-Authored-By: Claude Sonnet 5 <noreply@anthropic.com>"
      - "Co-authored-by: Claude <noreply@anthropic.com>"
    non_matches:
      - "Co-authored-by: Claudia Fernandes <claudia@example.com>"
      - "Reviewed-by: Claude"

  "Claude Code session trailer":
    matches:
      - "Claude-Session: https://claude.ai/code/session_01ABkTkEUqZbYXDbvZ1y69LV"
    non_matches:
      - "Claude-Session: local"
      - "See https://claude.ai/code/ for details"

  "Claude Code PR description footer":
    matches:
      - "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
    non_matches:
      - "Generated with Claude"
      - "Generated with [Codex](https://openai.com)"

  "Claude Code commit message footer":
    matches:
      - |
        feat(api): add the export endpoint

        🤖 Generated with [Claude Code](https://claude.com/claude-code)
    non_matches:
      - "feat(api): add the export endpoint"
      - "Generated with [Claude] Code"

  "GitHub Copilot coding agent bot author":
    matches:
      - "copilot-swe-agent[bot]"
      - "198982749+copilot-swe-agent[bot]@users.noreply.github.com"
    non_matches:
      - "copilot-swe-agent"
      - "copilot-pull-request-reviewer[bot]"

  "GitHub Copilot coding agent branch prefix":
    matches:
      - "copilot/fix-the-flaky-test"
    non_matches:
      - "feature/copilot-integration"
      - "my-copilot/branch"

  "GitHub Copilot co-author trailer":
    matches:
      - "Co-authored-by: Copilot <198982749+Copilot@users.noreply.github.com>"
    non_matches:
      - "Co-authored-by: Copilot Wilson <copilot.wilson@example.com>"
      - "Co-authored-by: GitHub Copilot"

  "GitHub Copilot coding agent body marker":
    matches:
      - "<!-- COPILOT_CODING_AGENT_START -->"
      - "<!-- copilot-coding-agent: session 42 -->"
    non_matches:
      - "<!-- generated by a coding agent -->"
      - "This was written with Copilot's help."

  "OpenAI Codex branch prefix":
    matches:
      - "codex/add-the-retry-policy"
    non_matches:
      - "feature/codex-support"
      - "my-codex/branch"

  "OpenAI Codex cloud task link":
    matches:
      - "Opened from https://chatgpt.com/codex/tasks/task_e_68f2a1"
    non_matches:
      - "https://chatgpt.com/share/68f2a1"
      - "https://openai.com/codex/"

  "Devin bot PR author":
    matches:
      - "devin-ai-integration[bot]"
      - "devin-ai-integration"
    non_matches:
      - "devin-smith"
      - "devin"

  "Devin session link":
    matches:
      - "Session: https://app.devin.ai/sessions/4f2c1a9e"
    non_matches:
      - "https://devin.ai/"
      - "https://app.devin.ai/settings"

  "Gemini Code Assist hidden review marker":
    matches:
      - "<!-- gemini-code-assist review summary -->"
    non_matches:
      - "<!-- reviewed with Gemini -->"
      - "gemini code assist"

  "Gemini CLI co-author trailer":
    matches:
      - "Co-authored-by: gemini-cli <gemini-cli@google.com>"
    non_matches:
      - "Co-authored-by: Gemma Hale <gemma@example.com>"
      - "Generated by the Gemini CLI"

  "Google Jules task link":
    matches:
      - "Task: https://jules.google.com/task/8812"
    non_matches:
      - "https://jules.google.com/"
      - "https://google.com/jules/task"

  "Cursor convention label":
    matches:
      - "cursor"
      - "Cursor"
    non_matches:
      - "cursor-agent"
      - "needs-cursor"

  "Cursor agent co-author trailer":
    matches:
      - "Co-authored-by: Cursor Agent <agent@cursor.com>"
      - "Co-Authored-By: Cursor <cursoragent@cursor.com>"
    non_matches:
      - "Co-authored-by: Cursorette Blake <c.blake@example.com>"
      - "Co-authored-by: Curso Rivera <curso@example.com>"

  "Aider commit message marker":
    matches:
      - "aider: refactor the parser"
    non_matches:
      - "raider: fix the thing"
      - "This was written with aider: see the log"

  "Windsurf branch prefix":
    matches:
      - "windsurf/cascade-fix"
    non_matches:
      - "feature/windsurf-support"
      - "my-windsurf/branch"

  "Charlie agent PR author":
    matches:
      - "charliecreates"
      - "charliecreates[bot]"
      - "charliehelps"
    non_matches:
      - "charlie"
      - "charlie-mcdonnell"
      - "notcharliecreates"

  "Charlie agent commit author":
    matches:
      - "198680274+charliecreates[bot]@users.noreply.github.com"
      - "charlie@charlielabs.ai"
    non_matches:
      - "charlie@example.com"
      - "charliecreates@users.noreply.github.com"

  "CodeRabbit review marker":
    matches:
      - "<!-- walkthrough_start -->"
      - "<!-- This is an auto-generated comment by CodeRabbit -->"
    non_matches:
      - "<!-- walkthrough of the new module -->"
      - "<!-- reviewed by a rabbit -->"

  "Robot emoji in a commit message":
    matches:
      - "🤖 Generated with an agent"
    non_matches:
      - "fix: correct the rounding error"
      - "feat: add the robot illustration"
