# Seed set for `manage.py seed_signal_rules` (phase 12, stage 4).
#
# These are NOT regexes. Each rule is a tuned instance of a `SignalKind` — a named heuristic about
# the *shape* of a pull request: how fast it arrived, how its commits are spaced, how many files it
# created. The `params` dict tunes the thresholds; every key must be one the kind understands.
#
# Two things are true of every rule here and cannot be configured away:
#
#   1. None of them may be `high` confidence. A database CheckConstraint enforces it. Only an
#      artefact the tool itself wrote (a commit trailer, a chat transcript in the diff) proves AI
#      authorship; a heuristic about a pull request's shape is evidence for a human to read.
#   2. One structural signal never moves a pull request's AI status on its own. From stage 5 it
#      takes `AI_SUSPECTED_MIN_STRUCTURAL_KINDS` (default 2) *distinct kinds* to reach
#      `ai_suspected`, and no combination of them ever reaches `ai_explicit`.
#
# Every rule ships DEACTIVATED. Unlike a vendor's commit trailer, a threshold has no right answer
# that holds across teams: a repository of generated API clients bursts commits all day, and a team
# that squashes before merge trips `single_large_commit` on every PR. Dry-run each rule against your
# own pull requests, read what it matched, adjust the numbers, then switch it on.
# See docs/user/tune-ai-detection.md.

rules:
  - name: "Large change delivered within two hours"
    kind: fast_large_pr
    params:
      min_lines: 400
      min_files: 8
      max_hours: 2
    tool: other
    confidence: medium
    notes: >
      Measures first commit to merge, not PR open to merge: opening the pull request late says
      nothing about how long the change took. Expect false positives on a revert, a generated
      migration, or a branch rebased shortly before merge — read the evidence before acting.

  - name: "Five substantial commits within 90 seconds"
    kind: commit_burst
    params:
      min_commits: 5
      max_gap_seconds: 90
      min_lines_per_commit: 20
    tool: other
    confidence: medium
    notes: >
      Only commits above min_lines_per_commit count, so a run of one-line fixups — a normal human
      habit — does not read as a burst. A scripted refactor or a bulk formatting pass will trip it.

  - name: "Whole change in one large commit"
    kind: single_large_commit
    params:
      min_lines: 300
      min_files: 5
    tool: other
    confidence: low
    notes: >
      Reads the pull request's own commit list, not the merge commit, so a squash *merge* does not
      trip it — but a team that squashes locally before pushing will trip it on every pull request.
      Low confidence for that reason; check your team's habits before activating.

  - name: "Ten new files across three directories"
    kind: mass_file_creation
    params:
      min_added_files: 10
      min_directories: 3
    tool: other
    confidence: medium
    notes: >
      Scaffolding in one sitting. Counts only files the diff marks as added, and only non-excluded
      paths, so a vendored tree or a lockfile never contributes. A new service or a code generator
      will trip it legitimately.

  - name: "Three commits within five minutes of a review comment"
    kind: instant_review_response
    params:
      max_minutes: 5
      min_occurrences: 3
    tool: other
    confidence: low
    notes: >
      Once is a reviewer catching something the author was already fixing. Three times is a
      different pattern. Comments by the pull request's own author are ignored, and each comment
      and each commit is counted at most once. An attentive developer sitting in the review will
      trip it, which is why it is low confidence.

  # --- Author baselines -----------------------------------------------------------------------
  #
  # These four ask a different question from the six above: not "is this pull request an odd
  # shape?" but "is this author's recent work an odd shape *for them*?". A developer who has
  # always shipped fast is not evidence of anything; a developer whose output changed shape last
  # month might be.
  #
  # They are recomputed nightly over a rolling window (`manage.py compute_baselines`), because a
  # baseline verdict changes when other pull requests arrive. None of them emits anything for an
  # author with fewer than MIN_SAMPLE pull requests of history.
  #
  # Read every match before acting on one. These describe a change in how somebody works, and
  # there are many innocent reasons for that: a new project, a new team, a holiday, a move, a
  # different kind of task. They are a prompt to ask, never an answer.
  - name: "Throughput jumped against the author's own history"
    kind: throughput_shift
    params:
      window_weeks: 8
      ratio: 2.5
      sustained_weeks: 2
    tool: other
    confidence: low
    notes: >
      Normalised by the team's own change over the same two windows, so a sprint or a release
      crunch that moved everybody moves nobody into a signal. Someone returning from leave, or
      finishing a long-running piece of work, will trip it legitimately.

  - name: "Volume moved outside the author's usual hours"
    kind: off_hours_volume
    params:
      window_weeks: 8
      percentile: 0.9
      min_share: 0.4
    tool: other
    confidence: low
    notes: >
      "Usual hours" is the author's own, taken from their earlier commits — nothing here assumes
      a nine-to-five, and a night owl's baseline is their own nights. A change of timezone, a
      newborn or a switch to part-time will trip it. Hours are read in REPORT_TIMEZONE.

  - name: "Test-to-code ratio barely varies"
    kind: test_ratio_lockstep
    params:
      window_weeks: 8
      min_prs: 10
      max_variance: 0.15
    tool: other
    confidence: low
    notes: >
      Real work varies: a bug fix is mostly test, a migration mostly not. A ratio that holds
      across a dozen changes is a generator's habit. Pull requests with no implementation lines
      are skipped rather than counted as zero, and an author who never writes tests does not trip
      it — that is a policy question, not an authorship signal.

  - name: "Pull-request descriptions broke from the author's own style"
    kind: body_style_shift
    params:
      window_weeks: 8
      min_prs: 10
      length_ratio: 4
    tool: other
    confidence: low
    notes: >
      Measured in both directions against the author's own median length, not against any idea of
      a good description: somebody who wrote two lines and now writes forty is as interesting as
      the reverse. A new PR template will trip it for the whole team at once, which is the first
      thing to check before reading anything into it.

  # --- Diff contents --------------------------------------------------------------------------
  #
  # These four read the bytes of the change, which live in no table. They run from the nightly
  # churn job, off the bare clone it already makes, and cost no GitHub API call — but only for the
  # repositories named in DIFF_ANALYSIS_REPOSITORIES, because reading the contents of every change
  # is an operator's choice. A repository that is not opted in produces nothing here, silently and
  # by design.
  #
  # `wholesale_reformat` is the most reliable of the four and the cheapest: one extra
  # `git diff -w --numstat` against a tree already on disk.
  - name: "Large diff with almost no semantic change"
    kind: wholesale_reformat
    params:
      min_lines: 200
      max_semantic_share: 0.15
    tool: other
    confidence: medium
    notes: >
      Counts the same diff twice, once normally and once ignoring whitespace: a change that moves
      hundreds of lines and alters almost nothing is a formatter's work. A deliberate "run the
      formatter over the repository" pull request trips it legitimately — which is why the evidence
      quotes both counts, so you can see that is what happened.

  - name: "Comment density far above the surrounding code"
    kind: comment_density_outlier
    params:
      min_added_lines: 60
      min_baseline_lines: 40
      min_density: 0.2
      ratio: 2.5
    tool: other
    confidence: low
    notes: >
      The baseline is the same files before the change, not a repository-wide average, so a
      well-commented codebase is not flagged for staying well commented. Test files and prose
      (Markdown, reStructuredText) are skipped, and a change made entirely of new files produces
      nothing — without a baseline there is nothing to be an outlier against. A developer who
      documents a tricky module properly will trip it, hence low confidence.

  - name: "The same block repeated across files"
    kind: duplicated_blocks
    params:
      block_lines: 8
      min_occurrences: 3
      min_files: 2
    tool: other
    confidence: low
    notes: >
      Compares added lines with whitespace and comments removed, so re-indented copies still
      match, and counts non-overlapping occurrences across at least min_files files. Legitimate
      duplication is everywhere — fixtures, migrations, boilerplate handlers, tests of the same
      shape — so read the pull request before drawing any conclusion.

  - name: "New dependency nothing in the diff uses"
    kind: unused_new_dependency
    params:
      manifests:
        - pyproject.toml
        - package.json
        - requirements*.txt
      max_matches: 5
    tool: other
    confidence: medium
    notes: >
      A manifest gains a package and no added line anywhere else in the change mentions it. The
      search for a use is deliberately loose — any mention of the name counts — because the failure
      to avoid is accusing a change that does use its new dependency. A dependency added for a
      later pull request, or one used only from a config file this cannot read, will trip it.
